name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
        working-directory: packages/pi-1c-agent
      - run: npm run scan:public
        working-directory: packages/pi-1c-agent
      - run: npm run doctor:package
        working-directory: packages/pi-1c-agent
